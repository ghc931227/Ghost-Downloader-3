name: Build browser extension release

on:
  push:
    branches: [ 'feat/resources-scope-checkbox' ]
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (optional)'
        required: false
      create_prerelease:
        description: 'Create as prerelease?'
        required: false
        default: 'true'
      draft:
        description: 'Create as draft?'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: browser_extension/app
        run: npm ci
      - name: Build extension bundles
        working-directory: browser_extension/app
        run: npm run build

      - name: Archive builds
        run: |
          cd browser_extension
          [ -d chromium ] && zip -r chromium.zip chromium || echo "Chromium build missing"
          [ -d firefox ] && zip -r firefox.zip firefox || echo "Firefox build missing"

      - name: Upload artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: browser_extension/*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.sha }}
          name: ${{ github.event.inputs.release_name || format('build-{0}', github.sha) }}
          body: |
            Automated build of browser extension from branch `${{ github.ref }}`.
            Commit: ${{ github.sha }}
            Includes chromium.zip and (if built) firefox.zip.
          draft: ${{ github.event.inputs.draft == 'true' || false }}
          prerelease: ${{ github.event.inputs.create_prerelease == 'true' || false }}
          files: |
            browser_extension/chromium.zip
            browser_extension/firefox.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
