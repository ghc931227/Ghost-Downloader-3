name: Build browser extension release

on:
  push:
    branches: [ 'feat/resources-scope-checkbox' ]
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (optional)'
        required: false
      create_prerelease:
        description: 'Create as prerelease?'
        type: boolean          # ← 用 boolean 类型而非字符串
        default: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # ← Node 18 已进入维护末期，建议升级

      - name: Install & Build
        working-directory: browser_extension/app
        run: |
          npm ci
          npm run build

      - name: Package builds
        run: |
          cd browser_extension
          # Chromium (必须存在)
          if [ ! -d chromium ]; then
            echo "::error::Chromium build output not found"
            exit 1
          fi
          zip -r chromium.zip chromium

          # Firefox (可选)
          if [ -d firefox ]; then
            zip -r firefox.zip firefox
          else
            echo "::warning::Firefox build output not found, skipping"
          fi

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2   # ← 现代替代方案
        with:
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          name: ${{ inputs.release_name || format('Build #{0}', github.run_number) }}
          body: |
            Automated build from `${{ github.ref_name }}` @ `${{ github.sha }}`
            
            - Workflow: `${{ github.workflow }}`
            - Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          draft: true
          prerelease: ${{ inputs.create_prerelease }}
          files: |                                    # ← 通配符自动匹配，不存在则跳过
            browser_extension/chromium.zip
            browser_extension/firefox.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
